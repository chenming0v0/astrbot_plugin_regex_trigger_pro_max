<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bot唤醒Pro Max — 控制台</title>
  <link rel="stylesheet" href="./console.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img class="logo" src="./logo.png" alt="Bot唤醒Pro Max">
      <div class="brand-text">
        <h1>BOT唤醒 <span class="accent">PRO MAX</span></h1>
        <p class="sub">regex / continuous / judge&nbsp;&nbsp;<span id="ver" class="accent">v?</span></p>
      </div>
    </div>
    <button id="save-btn" class="btn primary" type="button" disabled>保存配置</button>
  </header>

  <section id="status-bar" class="card statusbar">
    <div class="status-item"><span class="k">持续唤醒</span><span id="st-cont" class="v">--</span></div>
    <div class="status-item"><span class="k">唤醒正则</span><span id="st-regex" class="v">--</span></div>
    <div class="status-item wide"><span class="k">唤醒中的会话</span><span id="st-sessions" class="v">--</span></div>
  </section>

  <main id="panels" class="hidden">
    <section class="card">
      <h2>// 唤醒设置</h2>
      <div class="field">
        <label for="field-waking_regex">唤醒词正则 <code>waking_regex</code></label>
        <textarea id="field-waking_regex" rows="4" spellcheck="false" placeholder=".*小辰.*"></textarea>
        <p class="hint" data-hint="waking_regex"></p>
      </div>
      <fieldset class="subcard">
        <legend>持续唤醒 <code>continuous_awakening</code></legend>
        <div class="field inline">
          <label for="field-continuous_awakening.enable">启用群聊持续唤醒 <code>enable</code></label>
          <input type="checkbox" id="field-continuous_awakening.enable">
          <p class="hint" data-hint="continuous_awakening.enable"></p>
        </div>
        <div class="field">
          <label for="field-continuous_awakening.waking_interval">唤醒持续时长（秒） <code>waking_interval</code></label>
          <input type="number" id="field-continuous_awakening.waking_interval" min="5" step="1">
          <p class="hint" data-hint="continuous_awakening.waking_interval"></p>
        </div>
        <div class="field inline">
          <label for="field-continuous_awakening.reset_when_reply">回复时重置窗口 <code>reset_when_reply</code></label>
          <input type="checkbox" id="field-continuous_awakening.reset_when_reply">
          <p class="hint" data-hint="continuous_awakening.reset_when_reply"></p>
        </div>
      </fieldset>
    </section>

    <section class="card">
      <h2>// 小模型判定</h2>
      <div class="field">
        <label for="field-analysis_provider_id">判定用供应商 <code>analysis_provider_id</code></label>
        <select id="field-analysis_provider_id"></select>
        <p class="hint" data-hint="analysis_provider_id"></p>
      </div>
      <div class="field">
        <label for="field-analysis_fail_policy">判定失败兜底 <code>analysis_fail_policy</code></label>
        <select id="field-analysis_fail_policy">
          <option value="allow">allow — 判定挂了照常回复</option>
          <option value="block">block — 判定挂了拦下不回</option>
        </select>
        <p class="hint" data-hint="analysis_fail_policy"></p>
      </div>
      <div class="field inline">
        <label for="field-inject_emotion">向主模型注入情绪 <code>inject_emotion</code></label>
        <input type="checkbox" id="field-inject_emotion">
        <p class="hint" data-hint="inject_emotion"></p>
      </div>
      <div class="field">
        <label for="field-random_reply_chance">随机回复概率 0.0–1.0 <code>random_reply_chance</code></label>
        <input type="number" id="field-random_reply_chance" min="0" max="1" step="0.05">
        <p class="hint" data-hint="random_reply_chance"></p>
      </div>
      <div class="field">
        <label for="field-analysis_system_prompt">判定提示词 <code>analysis_system_prompt</code></label>
        <textarea id="field-analysis_system_prompt" rows="14" spellcheck="false" class="prompt-box"></textarea>
        <p class="hint" data-hint="analysis_system_prompt"></p>
      </div>
    </section>

    <section class="card">
      <h2>// 会话与历史</h2>
      <div class="field">
        <label for="field-whitelist">会话白名单 UMO <code>whitelist</code></label>
        <textarea id="field-whitelist" rows="3" spellcheck="false" placeholder="aiocqhttp:GroupMessage:114514&#10;留空 = 不限制"></textarea>
        <p class="hint" data-hint="whitelist"></p>
      </div>
      <div class="field">
        <label for="field-history_max_length">每会话最大历史条数 <code>history_max_length</code></label>
        <input type="number" id="field-history_max_length" min="1" step="1">
        <p class="hint" data-hint="history_max_length"></p>
      </div>
      <div class="field inline">
        <label for="field-record_emotion_in_history">历史记录里存情绪 <code>record_emotion_in_history</code></label>
        <input type="checkbox" id="field-record_emotion_in_history">
        <p class="hint" data-hint="record_emotion_in_history"></p>
      </div>
    </section>
  </main>

  <div id="no-bridge" class="card hidden">
    <h2>// 离线模式</h2>
    <p>检测不到 AstrBot 插件页面环境。</p>
    <p>请在 <span class="accent">AstrBot WebUI → 插件管理 → Bot唤醒Pro Max</span> 的插件详情页里打开本控制台。</p>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <script src="./app.js"></script>
</body>
</html>
